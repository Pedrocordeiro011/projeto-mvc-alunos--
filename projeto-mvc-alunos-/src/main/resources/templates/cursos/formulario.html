<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container estreito">
    <header class="topo">
        <div>
            <h1 th:text="${curso.id == null ? 'Novo curso' : 'Editar curso'}">Novo curso</h1>
            <p>Preencha os dados abaixo.</p>
        </div>
    </header>

    <div th:replace="~{fragmentos/nav :: nav('cursos')}"></div>
    <div th:replace="~{fragmentos/alertas :: alertas}"></div>

    <section class="card">
        <form th:action="@{/cursos/salvar}" th:object="${curso}" method="post" class="formulario">
            <input type="hidden" th:field="*{id}">

            <label for="nome">Nome</label>
            <input id="nome" type="text" th:field="*{nome}" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" rows="4" th:field="*{descricao}"></textarea>

            <label for="cargaHoraria">Carga horária (horas)</label>
            <input id="cargaHoraria" type="number" min="1" th:field="*{cargaHoraria}" required>

            <div class="acoes-formulario">
                <a class="botao secundario" th:href="@{/cursos}">Cancelar</a>
                <button class="botao" type="submit">Salvar</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
