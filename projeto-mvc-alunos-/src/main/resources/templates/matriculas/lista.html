<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrículas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <header class="topo">
        <div>
            <h1>Matrículas</h1>
            <p>Relação entre alunos e cursos</p>
        </div>
        <a class="botao" th:href="@{/matriculas/novo}">Nova matrícula</a>
    </header>

    <div th:replace="~{fragmentos/nav :: nav('matriculas')}"></div>
    <div th:replace="~{fragmentos/alertas :: alertas}"></div>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Aluno</th>
                <th>Curso</th>
                <th>Data</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="matricula : ${matriculas}">
                <td th:text="${matricula.id}">1</td>
                <td th:text="${matricula.aluno.nome}">Ana Souza</td>
                <td th:text="${matricula.curso.nome}">Desenvolvimento de Sistemas</td>
                <td th:text="${#temporals.format(matricula.dataMatricula, 'dd/MM/yyyy')}">01/03/2026</td>
                <td>
                    <span class="badge"
                          th:classappend="${matricula.status.name().toLowerCase()}"
                          th:text="${matricula.status}">ATIVA</span>
                </td>
                <td class="acoes">
                    <a class="botao secundario" th:href="@{/matriculas/editar/{id}(id=${matricula.id})}">Editar</a>

                    <form th:action="@{/matriculas/excluir/{id}(id=${matricula.id})}" method="post">
                        <button class="botao perigo" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="vazio" th:if="${#lists.isEmpty(matriculas)}">Nenhuma matrícula cadastrada.</p>
    </section>
</main>
</body>
</html>
